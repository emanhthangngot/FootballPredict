name: Pattern Frontend

on:
  pull_request:
    branches:
      - dev
      - master
    paths:
      - "pattern-frontend/**"
      - ".github/workflows/pattern-frontend.yml"
  push:
    branches:
      - dev
      - master
    paths:
      - "pattern-frontend/**"
      - ".github/workflows/pattern-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pattern-frontend:
    name: pattern-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pattern-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pattern-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build
