name: CD Artifacts

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - dev
      - master
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-artifacts:
    name: publish-artifacts
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow run commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout current commit
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish backend
        run: dotnet publish backend/FootballPredictor.Api/FootballPredictor.Api.csproj -c Release -o artifacts/backend

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build mobile Android artifact
        run: dotnet publish frontend/FootballPredictor.Mobile/FootballPredictor.Mobile.csproj -f net8.0-android -c Release -o artifacts/mobile

      - name: Bundle contracts and runtime files
        run: |
          mkdir -p artifacts/contracts artifacts/supabase artifacts/runtime
          cp -R contracts/. artifacts/contracts/
          cp -R supabase/. artifacts/supabase/
          cp docker-compose.local.yml artifacts/runtime/
          cp -R ai_engine etl artifacts/runtime/

      - name: Choose artifact retention
        id: retention
        run: |
          branch="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            branch="${{ github.event.workflow_run.head_branch }}"
          fi
          if [ "$branch" = "master" ]; then
            echo "days=30" >> "$GITHUB_OUTPUT"
          else
            echo "days=7" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: artifacts/backend
          retention-days: ${{ steps.retention.outputs.days }}

      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-${{ github.sha }}
          path: artifacts/mobile
          retention-days: ${{ steps.retention.outputs.days }}

      - name: Upload contracts artifact
        uses: actions/upload-artifact@v4
        with:
          name: contracts-${{ github.sha }}
          path: artifacts/contracts
          retention-days: ${{ steps.retention.outputs.days }}

      - name: Upload supabase artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-${{ github.sha }}
          path: artifacts/supabase
          retention-days: ${{ steps.retention.outputs.days }}

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ github.sha }}
          path: artifacts/runtime
          retention-days: ${{ steps.retention.outputs.days }}
