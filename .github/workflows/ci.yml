name: CI

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-policy:
    name: repo-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject direct Supabase mobile access
        run: |
          set -euo pipefail
          if grep -RInE "Supabase|supabase-js|supabase_flutter|Postgrest" \
            --include="*.cs" \
            --include="*.xaml" \
            frontend/FootballPredictor.Mobile; then
            echo "Mobile must call the backend BFF instead of Supabase directly."
            exit 1
          fi

  dotnet-backend:
    name: dotnet-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend
        run: dotnet restore backend/FootballPredictor.Api/FootballPredictor.Api.csproj

      - name: Build backend
        run: dotnet build backend/FootballPredictor.Api/FootballPredictor.Api.csproj -c Release --no-restore

  dotnet-mobile-android:
    name: dotnet-mobile-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore mobile
        run: dotnet restore frontend/FootballPredictor.Mobile/FootballPredictor.Mobile.csproj

      - name: Build mobile Android
        run: dotnet build frontend/FootballPredictor.Mobile/FootballPredictor.Mobile.csproj -f net8.0-android -c Release --no-restore

  python-ai:
    name: python-ai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync AI dependencies
        run: uv sync --project ai_engine --extra dev --frozen

      - name: Test AI engine
        run: uv run --project ai_engine pytest

  contracts-and-compose:
    name: contracts-and-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JSON schemas
        run: |
          python -m json.tool contracts/internal-ai/predict.schema.json >/dev/null
          python -m json.tool contracts/internal-ai/predict.response.schema.json >/dev/null

      - name: Validate YAML files
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python - <<'PY'
          import pathlib
          import yaml

          for path in [
              "contracts/openapi/footballpredict.v1.yaml",
              "docker-compose.local.yml",
          ]:
              with pathlib.Path(path).open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)
          print("yaml ok")
          PY

      - name: Validate Docker Compose config
        run: docker compose -f docker-compose.local.yml config
